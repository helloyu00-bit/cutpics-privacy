<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cutpics</title>
  <meta name="description" content="Cutpics 是一个面向 Obsidian 的快速采集工具。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237C4DFF'/%3E%3Cpath d='M18 33.5 28.5 44 47 20' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <style>
    :root {
      color-scheme: light;
      --text: #1f1f1f;
      --muted: #666666;
      --border: #ece8f8;
      --brand: #7c4dff;
      --brand-soft: #f5f1ff;
      --background: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: var(--background);
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 64px 24px 80px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 36px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 18px;
      font-size: 17px;
      line-height: 1.75;
    }

    .lead {
      max-width: 620px;
      color: var(--muted);
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 36px;
      padding-top: 28px;
      border-top: 1px solid var(--border);
    }

    a {
      color: var(--brand);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .button-link {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--brand-soft);
      color: var(--brand);
      font-weight: 600;
      text-decoration: none;
    }

    .button-link:hover {
      text-decoration: none;
      border-color: #d9cef8;
    }

    @media (max-width: 520px) {
      main {
        padding: 44px 22px 72px;
      }

      h1 {
        font-size: 32px;
      }

      .links {
        display: block;
      }

      .button-link {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Cutpics</h1>
    <p class="lead">Cutpics 是一个面向 Obsidian 的快速采集工具，用于把截图、图片、文字、链接和快速备注保存为 Markdown。</p>
    <div class="links">
      <a class="button-link" href="./privacy/">查看隐私政策</a>
      <a class="button-link" href="./support/">技术支持</a>
    </div>
  </main>
</body>
</html>
