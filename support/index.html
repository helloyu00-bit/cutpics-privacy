<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cutpics 技术支持</title>
  <meta name="description" content="Cutpics 技术支持" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237C4DFF'/%3E%3Cpath d='M18 33.5 28.5 44 47 20' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <style>
    :root {
      color-scheme: light;
      --text: #1f1f1f;
      --muted: #666666;
      --brand: #7c4dff;
      --border: #ece8f8;
      --background: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: var(--background);
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    nav {
      margin-bottom: 32px;
      font-size: 15px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    p,
    li {
      font-size: 16px;
      line-height: 1.75;
    }

    p {
      margin: 0 0 14px;
    }

    ul {
      margin: 0 0 20px;
      padding-left: 22px;
    }

    li + li {
      margin-top: 6px;
    }

    a {
      color: var(--brand);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .intro {
      margin-top: 28px;
    }

    .contact {
      margin: 24px 0 28px;
      padding: 18px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      word-break: break-word;
    }

    .footer {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 520px) {
      main {
        padding: 36px 22px 72px;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <main>
    <nav>
      <a href="../">Cutpics</a>
    </nav>

    <h1>Cutpics 技术支持</h1>

    <p class="intro">如果你在使用 Cutpics 时遇到问题，或希望反馈建议，可以通过以下方式联系我：</p>

    <p class="contact">邮箱：<a href="mailto:ccxinxiaoxin@gmail.com">ccxinxiaoxin@gmail.com</a></p>

    <p>请在邮件中尽量说明：</p>
    <ul>
      <li>遇到的问题</li>
      <li>使用的 iPhone 或 iPad 型号</li>
      <li>iOS 版本</li>
      <li>Cutpics 版本</li>
      <li>是否与 Obsidian、快捷指令或文件写入有关</li>
    </ul>

    <p>我会尽量根据反馈修复问题并改进 Cutpics。</p>

    <p class="footer"><a href="../privacy/">查看 Cutpics 隐私政策</a></p>
  </main>
</body>
</html>
